# Terminal-styled landing at daxxsec.tech (and www.daxxsec.tech).
# Hardened nginx container, routed via Traefik.

services:
  daxxsec-terminal:
    image: nginx:1.27-alpine
    container_name: daxxsec-terminal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,size=16M
      - /var/run:rw,size=4M
      - /tmp:rw,size=4M
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - "traefik.enable=true"
      # Apex + www
      - "traefik.http.routers.daxxsec.rule=Host(`daxxsec.tech`) || Host(`www.daxxsec.tech`)"
      - "traefik.http.routers.daxxsec.entrypoints=websecure"
      - "traefik.http.routers.daxxsec.tls=true"
      - "traefik.http.routers.daxxsec.tls.certresolver=letsencrypt"
      - "traefik.http.routers.daxxsec.middlewares=daxxsec-headers@docker,daxxsec-rl@docker,daxxsec-compress@docker"
      - "traefik.http.services.daxxsec.loadbalancer.server.port=8080"

      # Security headers — same hardened baseline as the SecVF site,
      # but CSP also permits `target=_blank` window.open (no script-src
      # 'unsafe-eval'; we don't use it). Inline-style allowed because
      # the matrix overlay manipulates style. (Still no `unsafe-eval`.)
      - "traefik.http.middlewares.daxxsec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.daxxsec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.daxxsec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.daxxsec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.daxxsec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.daxxsec-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.daxxsec-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.daxxsec-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
      - "traefik.http.middlewares.daxxsec-headers.headers.permissionsPolicy=geolocation=(), microphone=(), camera=(), payment=(), usb=()"
      - "traefik.http.middlewares.daxxsec-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.daxxsec-headers.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-origin"
      - "traefik.http.middlewares.daxxsec-headers.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.daxxsec-headers.headers.customResponseHeaders.X-Robots-Tag=index, follow"

      - "traefik.http.middlewares.daxxsec-rl.ratelimit.average=120"
      - "traefik.http.middlewares.daxxsec-rl.ratelimit.burst=240"
      - "traefik.http.middlewares.daxxsec-rl.ratelimit.period=1m"

      - "traefik.http.middlewares.daxxsec-compress.compress=true"
