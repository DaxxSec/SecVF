# SecVF marketing site — Traefik-routed, hardened nginx.
# Deploys to /docker/secvf-site/ on the VPS.
# DNS prerequisite: secvf.daxxsec.tech A → 187.124.95.26

services:
  secvf-site:
    image: nginx:1.27-alpine
    container_name: secvf-site
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,size=32M
      - /var/run:rw,size=4M
      - /tmp:rw,size=8M
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    mem_limit: 128m
    pids_limit: 64
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - "traefik.enable=true"

      # router: HTTPS only; HTTP→HTTPS redirect handled at Traefik entrypoint
      - "traefik.http.routers.secvf.rule=Host(`secvf.daxxsec.tech`)"
      - "traefik.http.routers.secvf.entrypoints=websecure"
      - "traefik.http.routers.secvf.tls=true"
      - "traefik.http.routers.secvf.tls.certresolver=letsencrypt"
      - "traefik.http.routers.secvf.middlewares=secvf-headers@docker,secvf-ratelimit@docker,secvf-compress@docker"
      - "traefik.http.services.secvf.loadbalancer.server.port=8080"

      # wiki.daxxsec.tech → 308 redirect to /wiki/ on the canonical host
      - "traefik.http.routers.secvf-wiki.rule=Host(`wiki.daxxsec.tech`)"
      - "traefik.http.routers.secvf-wiki.entrypoints=websecure"
      - "traefik.http.routers.secvf-wiki.tls=true"
      - "traefik.http.routers.secvf-wiki.tls.certresolver=letsencrypt"
      - "traefik.http.routers.secvf-wiki.middlewares=secvf-wiki-redirect@docker"
      - "traefik.http.middlewares.secvf-wiki-redirect.redirectregex.regex=^https?://wiki\\.daxxsec\\.tech/(.*)"
      - "traefik.http.middlewares.secvf-wiki-redirect.redirectregex.replacement=https://secvf.daxxsec.tech/wiki/$${1}"
      - "traefik.http.middlewares.secvf-wiki-redirect.redirectregex.permanent=true"

      # security headers
      - "traefik.http.middlewares.secvf-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secvf-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secvf-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.secvf-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secvf-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.secvf-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.secvf-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.secvf-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
      - "traefik.http.middlewares.secvf-headers.headers.permissionsPolicy=geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()"
      - "traefik.http.middlewares.secvf-headers.headers.customResponseHeaders.X-Robots-Tag=index, follow"
      - "traefik.http.middlewares.secvf-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.secvf-headers.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-origin"
      - "traefik.http.middlewares.secvf-headers.headers.customResponseHeaders.Server="

      # rate limit (per-IP, sliding window)
      - "traefik.http.middlewares.secvf-ratelimit.ratelimit.average=120"
      - "traefik.http.middlewares.secvf-ratelimit.ratelimit.burst=240"
      - "traefik.http.middlewares.secvf-ratelimit.ratelimit.period=1m"

      - "traefik.http.middlewares.secvf-compress.compress=true"
      - "traefik.http.middlewares.secvf-compress.compress.excludedContentTypes=image/png,image/jpeg,image/webp,image/avif"
