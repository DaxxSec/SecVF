# SecVF static site — internal listener, fronted by Traefik (TLS termination upstream)

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # disallow non-GET/HEAD on a static site
    if ($request_method !~ ^(GET|HEAD)$ ) { return 405; }

    # block hidden files except .well-known
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }

    # primary content (HTML — short cache, must-revalidate)
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # long cache for fingerprinted/static assets (we don't fingerprint yet, but
    # treat /assets/ as immutable-ish — short enough to update without bumping URLs)
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # CSS / JS — stylesheet may change with site updates; medium cache
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        try_files $uri =404;
    }

    # well-known files
    location = /robots.txt    { access_log off; try_files $uri =404; }
    location = /sitemap.xml   { access_log off; try_files $uri =404; }
    location = /favicon.ico   { access_log off; log_not_found off; try_files $uri =404; }

    # custom 404
    error_page 404 /404.html;
    location = /404.html { internal; }

    # 405 fallback
    error_page 405 = @method_not_allowed;
    location @method_not_allowed { return 405 '{"error":"method not allowed"}'; default_type application/json; }
}
