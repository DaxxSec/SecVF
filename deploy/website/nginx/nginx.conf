user nginx;
worker_processes auto;
worker_rlimit_nofile 4096;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # logs
    log_format secvf '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout secvf;

    # hide nginx version; Traefik middleware further blanks the Server header upstream
    server_tokens off;

    # performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    # static-site limits — be stingy
    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # gzip — Traefik also compresses, but having both is fine on static
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss application/atom+xml
        image/svg+xml font/ttf font/otf;

    include /etc/nginx/conf.d/*.conf;
}
