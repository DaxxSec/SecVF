# Loki — single-binary mode, local filesystem storage, no external deps.
# Tuned for a single-host analyst workstation, not a multi-tenant cluster.

auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  chunk_idle_period: 1h
  max_chunk_age: 2h
  chunk_target_size: 1572864     # 1.5 MB
  chunk_retain_period: 30s

limits_config:
  # Single analyst, no multi-tenancy abuse to defend against.
  reject_old_samples: true
  reject_old_samples_max_age: 7d
  retention_period: 720h         # 30 days default
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_streams_per_user: 5000
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 75
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: ""           # Grafana handles alerting

# Disable the version-check phone-home. We update by pulling new images.
analytics:
  reporting_enabled: false
