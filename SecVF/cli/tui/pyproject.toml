[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secvf-tui"
version = "0.1.0"
description = "Terminal UI for SecVF - Security Virtualization Framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ItzDaxxy" }
]
keywords = [
    "virtualization",
    "security",
    "malware-analysis",
    "incident-response",
    "terminal-ui",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Emulators",
]
dependencies = [
    "textual>=0.47.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
# Standalone TUI entry point
secvf-tui = "secvf_tui.app:main"

# Note: The preferred way to run the TUI is via the Swift CLI:
#   secvf tui
# This script is provided for standalone Python installation.

[project.urls]
Homepage = "https://github.com/ItzDaxxy/SecVF"
Documentation = "https://github.com/ItzDaxxy/SecVF#readme"
Repository = "https://github.com/ItzDaxxy/SecVF"

[tool.hatch.build.targets.wheel]
packages = ["secvf_controller", "secvf_tui"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
