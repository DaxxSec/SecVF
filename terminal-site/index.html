<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>daxxsec.tech — terminal</title>
<meta name="description" content="A working terminal in your browser. Type `help` to begin.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="canonical" href="https://daxxsec.tech/">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="crt" id="crt">
  <div class="scanlines" aria-hidden="true"></div>

  <header class="bar" aria-hidden="true">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="title">guest@daxxsec — /bin/zsh — 96×28</span>
    <span class="spacer"></span>
  </header>

  <main class="screen" id="screen" tabindex="0">
    <div id="output" role="log" aria-live="polite" aria-atomic="false"></div>

    <div class="prompt-row" id="prompt-row">
      <span class="ps1"><span class="user">guest</span><span class="at">@</span><span class="host">daxxsec</span><span class="colon">:</span><span class="path" id="cwd">~</span><span class="dollar">$</span></span>
      <span class="input-wrap">
        <span class="echo" id="echo"></span><span class="cursor" id="cursor">▋</span>
      </span>
      <input
        id="input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Terminal input"
      >
    </div>
  </main>
</div>

<script src="/term.js" defer></script>
</body>
</html>
